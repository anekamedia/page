    @keyframes subtleLevitate {

      }
      50% {
        transform: translateY(-14px) rotate(0.4deg);
      }

    @keyframes auraMorph {

        transform: scale(0.95) rotate(0deg);
        filter: blur(55px);
        opacity: 0.65;
      }
      33% {
        transform: scale(1.08) rotate(120deg);
        filter: blur(75px);
        opacity: 0.85;
      }
      66% {
        transform: scale(1.02) rotate(240deg);
        filter: blur(60px);
        opacity: 0.7;
      }
      100% {
        transform: scale(0.95) rotate(360deg);
        filter: blur(55px);
        opacity: 0.65;

    @keyframes lightSheen {
      0% {
        transform: translateX(-160%) skewX(-25deg);
      }
      100% {
        transform: translateX(220%) skewX(-25deg);
      }
    }

    }

    }

    .sheen-shimmer {

    }

    /* 3D Perspective container */

    }

    .transform-gpu {

  <!-- 3D Perspective Mouse Tracking Engine -->
  <script data-purpose="3d-tilt-interaction">
    (function initTilt() {
      const container = document.getElementById('tilt-container');
      const card = document.getElementById('tilt-card');
      const logo = document.getElementById('hero-logo');

      if (!container || !card) return;

      let boundingBox = container.getBoundingClientRect();
      let isHovered = false;

      function updateBounds() {
        boundingBox = container.getBoundingClientRect();
      }

      window.addEventListener('resize', updateBounds);
      window.addEventListener('scroll', updateBounds);

      container.addEventListener('mouseenter', () => {
        isHovered = true;
      });

      window.addEventListener('mousemove', (e) => {
        const { clientX, clientY } = e;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        // Calculate cursor offset relative to window center (-1 to 1)
        const deltaX = (clientX - centerX) / centerX;
        const deltaY = (clientY - centerY) / centerY;

        // Dynamic 3D rotation angles
        const maxRotation = 22; // max tilt degrees
        const rotateY = deltaX * maxRotation;
        const rotateX = -deltaY * maxRotation;

        // Logo parallax translation depth
        const parallaxTranslateX = deltaX * 12;
        const parallaxTranslateY = deltaY * 12;

        card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`;
        if (logo) {
          logo.style.transform = `translate3d(${parallaxTranslateX.toFixed(1)}px, ${parallaxTranslateY.toFixed(1)}px, 30px)`;
        }
      });

      // Smooth restoration to natural position on mouse leave
      container.addEventListener('mouseleave', () => {
        isHovered = false;
        card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        if (logo) {
          logo.style.transform = `translate3d(0px, 0px, 0px)`;
        }
      });

      // Tactile click shockwave effect
      container.addEventListener('mousedown', () => {
        card.style.transform += ` scale3d(0.96, 0.96, 0.96)`;
      });

      container.addEventListener('mouseup', () => {
        card.style.transform = card.style.transform.replace(' scale3d(0.96, 0.96, 0.96)', '');
      });
    })();
  </script>

  <!-- Ambient Light Dust Particle Canvas -->
  <script data-purpose="ambient-dust-canvas">
    (function initDustParticles() {
      const canvas = document.getElementById('particle-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const colors = ['#00AEEF', '#EC008C', '#FFF200', '#ffffff'];
      const particlesCount = 42;
      const particles = [];

      for (let i = 0; i < particlesCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.6 + 0.4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 0.35,
          vy: -Math.random() * 0.45 - 0.1,
          alpha: Math.random() * 0.6 + 0.2
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
          }
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.shadowBlur = 8;
          ctx.shadowColor = p.color;
          ctx.fill();
        }

        requestAnimationFrame(render);
      }

      render();
    })();
  </script>
